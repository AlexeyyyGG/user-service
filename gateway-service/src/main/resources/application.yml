server:
  port: 8082
spring:
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service-web
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/users
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8789/eureka/}

resilience4j:
  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeoutDuration: 5s